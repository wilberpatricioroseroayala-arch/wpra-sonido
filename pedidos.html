<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Eventos y Sonido W&R — Pide tu Canción en Vivo</title>
  <style>
    :root {
      --bg-main: #0b1116;
      --bg-card: #131c24;
      --bg-card-selected: #1c2419;
      --bg-input: #18232c;
      --border-subtle: #243340;
      --green-primary: #25d366;
      --green-dark: #1da851;
      --gold-accent: #eab308;
      --gold-bg: rgba(234, 179, 8, 0.14);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 165px;
      line-height: 1.4;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 17, 22, 0.97);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 14px 8px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1.5px solid var(--gold-accent);
      color: var(--gold-accent);
      font-weight: 800;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .counter-pill {
      background: var(--gold-bg);
      border: 1px solid rgba(234, 179, 8, 0.45);
      color: var(--gold-accent);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .search-box {
      position: relative;
      margin-bottom: 8px;
    }

    .search-box input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1.5px solid #2a3f4d;
      border-radius: 10px;
      padding: 9px 36px 9px 14px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--green-primary);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #2b3c49;
      color: #cbd5e1;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .genres-bar {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .genres-bar::-webkit-scrollbar {
      display: none;
    }

    .genre-chip {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 8px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }

    .genre-chip.active {
      background-color: var(--green-primary);
      border-color: var(--green-primary);
      color: #052e16;
      font-weight: 700;
    }

    /* Barra rápida alfabética A-Z */
    .alpha-bar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-top: 4px;
      border-top: 1px solid rgba(36, 51, 64, 0.7);
      scrollbar-width: none;
    }

    .alpha-bar::-webkit-scrollbar {
      display: none;
    }

    .alpha-btn {
      min-width: 26px;
      height: 26px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .alpha-btn.has-items {
      color: #e2e8f0;
      background: rgba(24, 35, 44, 0.85);
      border-color: var(--border-subtle);
    }

    .alpha-btn.has-items:active {
      background: var(--gold-accent);
      color: #0b1116;
    }

    .alpha-btn:disabled {
      opacity: 0.28;
      cursor: default;
    }

    main {
      padding: 10px 14px;
      max-width: 640px;
      margin: 0 auto;
    }

    .history-banner {
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.35);
      color: #86efac;
      font-size: 12px;
      padding: 8px 11px;
      border-radius: 9px;
      margin-bottom: 10px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-banner button {
      background: transparent;
      border: none;
      color: #86efac;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }

    .results-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sort-toggle {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--gold-accent);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .letter-divider {
      font-size: 12px;
      font-weight: 800;
      color: var(--gold-accent);
      background: rgba(234, 179, 8, 0.08);
      border-left: 3px solid var(--gold-accent);
      padding: 3px 9px;
      border-radius: 4px;
      margin-top: 6px;
      scroll-margin-top: 165px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .song-card.selected {
      background-color: var(--bg-card-selected);
      border-color: var(--gold-accent);
    }

    .song-info {
      min-width: 0;
      flex: 1;
    }

    .song-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 13px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .song-genre {
      display: inline-block;
      font-size: 11px;
      color: var(--gold-accent);
      background: rgba(234, 179, 8, 0.1);
      padding: 2px 7px;
      border-radius: 5px;
      margin-top: 4px;
    }

    .pick-btn {
      background-color: var(--green-primary);
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.1s, background-color 0.15s;
    }

    .pick-btn:active {
      transform: scale(0.96);
    }

    .song-card.selected .pick-btn {
      background-color: var(--gold-bg);
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1e293b;
      border: 1px solid var(--gold-accent);
      color: #fef08a;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      z-index: 60;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s ease;
      text-align: center;
      width: max-content;
      max-width: 90vw;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: #0f1720;
      border-top: 1px solid #283845;
      padding: 10px 14px 14px;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.55);
    }

    .bottom-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .selected-preview {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .selected-preview::-webkit-scrollbar {
      display: none;
    }

    .mini-tag {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-tag span {
      color: #f87171;
      font-weight: 700;
      cursor: pointer;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .guest-input, .dedication-select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid #334656;
      border-radius: 9px;
      padding: 9px 10px;
      color: var(--text-main);
      font-size: 13.5px;
      outline: none;
    }

    .guest-input:focus, .dedication-select:focus {
      border-color: var(--green-primary);
    }

    .wa-btn {
      width: 100%;
      background: var(--green-primary);
      color: #052e16;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, opacity 0.2s;
    }

    .wa-btn:disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">Máximo 3 canciones por pedido</div>

  <header>
    <div class="brand-row">
      <div class="brand-title">
        <div class="logo-badge">W&amp;R</div>
        <div class="brand-text">
          <h1>Eventos y Sonido W&amp;R</h1>
          <p>Pide tu canción del catálogo en vivo</p>
        </div>
      </div>
      <div id="counterPill" class="counter-pill">0 / 3 elegidas</div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Busca por canción o artista (sin tildes)..." autocomplete="off" />
      <button id="clearSearch" class="clear-btn" title="Limpiar búsqueda">✕</button>
    </div>

    <div id="genresBar" class="genres-bar">
      <button class="genre-chip active" data-genre="TODOS">Todos</button>
    </div>

    <div id="alphaBar" class="alpha-bar"></div>
  </header>

  <main>
    <div id="historyBanner" class="history-banner">
      <span id="historyText"></span>
      <button id="closeHistory" title="Ocultar aviso">✕</button>
    </div>

    <div class="results-info">
      <span id="resultsCount">Cargando catálogo...</span>
      <button id="sortToggle" class="sort-toggle" title="Cambiar orden alfabético">Orden: Título A–Z ⇅</button>
    </div>
    <div id="songList" class="song-list"></div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <div id="selectedPreview" class="selected-preview"></div>
      <div class="meta-row">
        <input type="text" id="guestName" class="guest-input" placeholder="Mesa (opcional, ej. Mesa 5)" maxlength="40" />
        <select id="dedicationSelect" class="dedication-select" aria-label="Motivo o dedicatoria">
          <option value="">Motivo: Normal</option>
          <option value="Para prender la pista">🔥 Para bailar</option>
          <option value="Cumpleaños">🎂 Cumpleaños</option>
          <option value="Aniversario / Parejas">🥂 Aniversario</option>
          <option value="Dedicatoria especial">🎤 Dedicatoria</option>
        </select>
      </div>
      <button id="sendWaBtn" class="wa-btn" disabled>
        Selecciona al menos 1 canción
      </button>
    </div>
  </div>

  <script>
    const WHATSAPP_NUMBER = "593993983329";
    const MAX_SONGS = 3;
    const COOLDOWN_SECONDS = 180; // 3 minutos de espera entre envíos para evitar saturación
    const CSV_FILE = "musica.csv";
    const STORAGE_KEY_COOLDOWN = "wr_last_sent_ts";
    const STORAGE_KEY_HISTORY = "wr_last_songs";

    let allSongs = [];
    let selectedSongs = [];
    let activeGenre = "TODOS";
    let searchQuery = "";
    let sortBy = "titulo";
    let cooldownInterval = null;

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearch");
    const genresBar = document.getElementById("genresBar");
    const alphaBar = document.getElementById("alphaBar");
    const songList = document.getElementById("songList");
    const resultsCount = document.getElementById("resultsCount");
    const sortToggle = document.getElementById("sortToggle");
    const counterPill = document.getElementById("counterPill");
    const selectedPreview = document.getElementById("selectedPreview");
    const guestNameInput = document.getElementById("guestName");
    const dedicationSelect = document.getElementById("dedicationSelect");
    const sendWaBtn = document.getElementById("sendWaBtn");
    const toastEl = document.getElementById("toast");
    const historyBanner = document.getElementById("historyBanner");
    const historyText = document.getElementById("historyText");
    const closeHistory = document.getElementById("closeHistory");

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    // Normalizar texto eliminando tildes, diéresis y signos para búsqueda tolerante
    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    // Obtener la letra índice (# o A-Z) según el criterio de ordenamiento
    function getIndexLetter(song) {
      const target = sortBy === "artista" ? song.artista : song.titulo;
      const clean = normalizeText(target).toUpperCase();
      if (!clean) return "#";
      const first = clean.charAt(0);
      return first >= "A" && first <= "Z" ? first : "#";
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
      if (lines.length < 2) return [];

      const songs = [];
      for (let i = 1; i < lines.length; i++) {
        const row = [];
        let current = "";
        let inQuotes = false;

        for (let c = 0; c < lines[i].length; c++) {
          const char = lines[i][c];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === "," && !inQuotes) {
            row.push(current.trim());
            current = "";
          } else {
            current += char;
          }
        }
        row.push(current.trim());

        if (row.length >= 3 && row[0]) {
          const titulo = row[0];
          const artista = row[1] || "Artista Varios";
          const genero = row[2] || "General";
          songs.push({
            id: i,
            titulo,
            artista,
            genero,
            searchBlob: normalizeText(`${titulo} ${artista} ${genero.replace(/_/g, " ")}`)
          });
        }
      }
      return songs;
    }

    function sortSongsList(list) {
      return [...list].sort((a, b) => {
        if (sortBy === "artista") {
          const cmpArt = a.artista.localeCompare(b.artista, "es", { sensitivity: "base" });
          return cmpArt !== 0 ? cmpArt : a.titulo.localeCompare(b.titulo, "es", { sensitivity: "base" });
        } else {
          const cmpTit = a.titulo.localeCompare(b.titulo, "es", { sensitivity: "base" });
          return cmpTit !== 0 ? cmpTit : a.artista.localeCompare(b.artista, "es", { sensitivity: "base" });
        }
      });
    }

    async function loadCatalog() {
      try {
        const response = await fetch(CSV_FILE + "?v=" + Date.now());
        if (!response.ok) throw new Error("No se pudo cargar musica.csv");
        const csvText = await response.text();
        allSongs = parseCSV(csvText);
        buildGenreChips();
        renderHistoryBanner();
        startCooldownTimer();
        renderSongs();
      } catch (err) {
        resultsCount.textContent = "Error al cargar el catálogo.";
        songList.innerHTML = `<div class="empty-state">No se encontró el archivo <b>musica.csv</b> en el servidor.</div>`;
      }
    }

    function buildGenreChips() {
      const genres = [...new Set(allSongs.map(s => s.genero))].sort((a, b) =>
        a.localeCompare(b, "es", { sensitivity: "base" })
      );
      genres.forEach(genre => {
        const btn = document.createElement("button");
        btn.className = "genre-chip";
        btn.dataset.genre = genre;
        btn.textContent = genre.replace(/_/g, " ");
        btn.addEventListener("click", () => {
          document.querySelectorAll(".genre-chip").forEach(c => c.classList.remove("active"));
          btn.classList.add("active");
          activeGenre = genre;
          renderSongs();
        });
        genresBar.appendChild(btn);
      });

      genresBar.querySelector('[data-genre="TODOS"]').addEventListener("click", (e) => {
        document.querySelectorAll(".genre-chip").forEach(c => c.classList.remove("active"));
        e.target.classList.add("active");
        activeGenre = "TODOS";
        renderSongs();
      });
    }

    function updateAlphaBar(availableLetters) {
      const letters = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")];
      alphaBar.innerHTML = "";
      letters.forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "alpha-btn";
        btn.textContent = letter;
        if (availableLetters.has(letter)) {
          btn.classList.add("has-items");
          btn.addEventListener("click", () => {
            const target = document.getElementById(`letter-${letter}`);
            if (target) {
              target.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        } else {
          btn.disabled = true;
        }
        alphaBar.appendChild(btn);
      });
    }

    function isSelected(songId) {
      return selectedSongs.some(s => s.id === songId);
    }

    function toggleSong(song) {
      const idx = selectedSongs.findIndex(s => s.id === song.id);
      if (idx > -1) {
        selectedSongs.splice(idx, 1);
      } else {
        if (selectedSongs.length >= MAX_SONGS) {
          showToast(`Máximo ${MAX_SONGS} canciones por pedido`);
          return;
        }
        selectedSongs.push(song);
      }
      updateSelectionUI();
      renderSongs();
    }

    function getRemainingCooldown() {
      const lastSent = parseInt(localStorage.getItem(STORAGE_KEY_COOLDOWN) || "0", 10);
      if (!lastSent) return 0;
      const elapsed = Math.floor((Date.now() - lastSent) / 1000);
      return Math.max(0, COOLDOWN_SECONDS - elapsed);
    }

    function startCooldownTimer() {
      if (cooldownInterval) clearInterval(cooldownInterval);
      updateSelectionUI();
      cooldownInterval = setInterval(() => {
        if (getRemainingCooldown() <= 0) {
          clearInterval(cooldownInterval);
          cooldownInterval = null;
        }
        updateSelectionUI();
      }, 1000);
    }

    function updateSelectionUI() {
      const count = selectedSongs.length;
      counterPill.textContent = `${count} / ${MAX_SONGS} elegidas`;

      selectedPreview.innerHTML = "";
      selectedSongs.forEach(song => {
        const tag = document.createElement("div");
        tag.className = "mini-tag";
        tag.innerHTML = `${escapeHtml(song.titulo)} <span title="Quitar">✕</span>`;
        tag.querySelector("span").addEventListener("click", () => toggleSong(song));
        selectedPreview.appendChild(tag);
      });

      const remaining = getRemainingCooldown();
      if (remaining > 0) {
        const mins = Math.floor(remaining / 60);
        const secs = String(remaining % 60).padStart(2, "0");
        sendWaBtn.disabled = true;
        sendWaBtn.textContent = `⏳ Espera ${mins}:${secs} para el siguiente pedido`;
        return;
      }

      if (count === 0) {
        sendWaBtn.disabled = true;
        sendWaBtn.textContent = "Selecciona al menos 1 canción";
      } else {
        sendWaBtn.disabled = false;
        const label = count === 1 ? "1 canción" : `${count} canciones`;
        sendWaBtn.textContent = `📲 Enviar pedido por WhatsApp (${label})`;
      }
    }

    function renderHistoryBanner() {
      const lastHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
      if (lastHistory) {
        historyText.textContent = `✓ Último pedido enviado: ${lastHistory}`;
        historyBanner.style.display = "flex";
      } else {
        historyBanner.style.display = "none";
      }
    }

    closeHistory.addEventListener("click", () => {
      historyBanner.style.display = "none";
    });

    function renderSongs() {
      const qNorm = normalizeText(searchQuery);
      const tokens = qNorm ? qNorm.split(" ") : [];

      const filtered = allSongs.filter(song => {
        const matchGenre = activeGenre === "TODOS" || song.genero === activeGenre;
        if (!matchGenre) return false;
        if (tokens.length === 0) return true;
        return tokens.every(tok => song.searchBlob.includes(tok));
      });

      const sorted = sortSongsList(filtered);
      resultsCount.textContent = `${sorted.length} canciones (A–Z)`;

      if (sorted.length === 0) {
        updateAlphaBar(new Set());
        songList.innerHTML = `<div class="empty-state">No encontramos canciones con ese nombre.<br>Prueba con otro artista o género.</div>`;
        return;
      }

      const availableLetters = new Set();
      let currentLetter = "";
      const fragment = document.createDocumentFragment();

      sorted.forEach(song => {
        const letter = getIndexLetter(song);
        availableLetters.add(letter);

        if (letter !== currentLetter) {
          currentLetter = letter;
          const divider = document.createElement("div");
          divider.className = "letter-divider";
          divider.id = `letter-${letter}`;
          divider.textContent = letter;
          fragment.appendChild(divider);
        }

        const chosen = isSelected(song.id);
        const card = document.createElement("div");
        card.className = "song-card" + (chosen ? " selected" : "");

        card.innerHTML = `
          <div class="song-info">
            <div class="song-title">${escapeHtml(song.titulo)}</div>
            <div class="song-artist">${escapeHtml(song.artista)}</div>
            <span class="song-genre">${escapeHtml(song.genero)}</span>
          </div>
          <button class="pick-btn">${chosen ? "✓ Elegida" : "+ Pedir"}</button>
        `;

        card.querySelector(".pick-btn").addEventListener("click", () => toggleSong(song));
        fragment.appendChild(card);
      });

      updateAlphaBar(availableLetters);
      songList.innerHTML = "";
      songList.appendChild(fragment);
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    sortToggle.addEventListener("click", () => {
      if (sortBy === "titulo") {
        sortBy = "artista";
        sortToggle.textContent = "Orden: Artista A–Z ⇅";
      } else {
        sortBy = "titulo";
        sortToggle.textContent = "Orden: Título A–Z ⇅";
      }
      renderSongs();
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.style.display = searchQuery ? "flex" : "none";
      renderSongs();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.style.display = "none";
      renderSongs();
      searchInput.focus();
    });

    sendWaBtn.addEventListener("click", () => {
      if (selectedSongs.length === 0 || getRemainingCooldown() > 0) return;

      const mesa = guestNameInput.value.trim();
      const motivo = dedicationSelect.value;

      let msg = `🎧 *PEDIDO EN VIVO — Eventos y Sonido W&R*\n`;
      if (mesa) {
        msg += `🪑 *Mesa:* ${mesa}\n`;
      }
      if (motivo) {
        msg += `✨ *Motivo:* ${motivo}\n`;
      }
      msg += `\n🎵 *Canciones solicitadas:*\n`;

      selectedSongs.forEach((s, idx) => {
        msg += `${idx + 1}. *${s.titulo}* — ${s.artista} _(${s.genero})_\n`;
      });

      const summaryTitles = selectedSongs.map(s => s.titulo).join(", ");
      localStorage.setItem(STORAGE_KEY_HISTORY, summaryTitles);
      localStorage.setItem(STORAGE_KEY_COOLDOWN, String(Date.now()));

      // Limpiar selección automáticamente para evitar envíos duplicados
      selectedSongs = [];
      dedicationSelect.value = "";
      renderHistoryBanner();
      startCooldownTimer();
      renderSongs();

      const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
      window.open(waUrl, "_blank");
    });

    loadCatalog();
  </script>
</body>
</html>
