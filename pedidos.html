<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Eventos y Sonido W&R — Pide tu Canción en Vivo</title>
  <style>
    :root {
      --bg-main: #0b1116;
      --bg-card: #131c24;
      --bg-card-selected: #1c2419;
      --bg-input: #18232c;
      --border-subtle: #243340;
      --green-primary: #25d366;
      --green-dark: #1da851;
      --gold-accent: #eab308;
      --gold-bg: rgba(234, 179, 8, 0.14);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 145px;
      line-height: 1.4;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 17, 22, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 16px 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1.5px solid var(--gold-accent);
      color: var(--gold-accent);
      font-weight: 800;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .counter-pill {
      background: var(--gold-bg);
      border: 1px solid rgba(234, 179, 8, 0.45);
      color: var(--gold-accent);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1.5px solid #2a3f4d;
      border-radius: 10px;
      padding: 10px 36px 10px 14px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--green-primary);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #2b3c49;
      color: #cbd5e1;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .genres-bar {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .genres-bar::-webkit-scrollbar {
      display: none;
    }

    .genre-chip {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }

    .genre-chip.active {
      background-color: var(--green-primary);
      border-color: var(--green-primary);
      color: #052e16;
      font-weight: 700;
    }

    main {
      padding: 12px 14px;
      max-width: 640px;
      margin: 0 auto;
    }

    .results-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sort-toggle {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--gold-accent);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .song-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .song-card.selected {
      background-color: var(--bg-card-selected);
      border-color: var(--gold-accent);
    }

    .song-info {
      min-width: 0;
      flex: 1;
    }

    .song-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 13px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .song-genre {
      display: inline-block;
      font-size: 11px;
      color: var(--gold-accent);
      background: rgba(234, 179, 8, 0.1);
      padding: 2px 7px;
      border-radius: 5px;
      margin-top: 5px;
    }

    .pick-btn {
      background-color: var(--green-primary);
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.1s, background-color 0.15s;
    }

    .pick-btn:active {
      transform: scale(0.96);
    }

    .song-card.selected .pick-btn {
      background-color: var(--gold-bg);
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1e293b;
      border: 1px solid var(--gold-accent);
      color: #fef08a;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      z-index: 60;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s ease;
      text-align: center;
      width: max-content;
      max-width: 90vw;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: #0f1720;
      border-top: 1px solid #283845;
      padding: 10px 14px 14px;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.55);
    }

    .bottom-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .selected-preview {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .selected-preview::-webkit-scrollbar {
      display: none;
    }

    .mini-tag {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-tag span {
      color: #f87171;
      font-weight: 700;
      cursor: pointer;
    }

    .guest-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid #334656;
      border-radius: 9px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .guest-input:focus {
      border-color: var(--green-primary);
    }

    .wa-btn {
      width: 100%;
      background: var(--green-primary);
      color: #052e16;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, opacity 0.2s;
    }

    .wa-btn:disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">Máximo 3 canciones por pedido</div>

  <header>
    <div class="brand-row">
      <div class="brand-title">
        <div class="logo-badge">W&amp;R</div>
        <div class="brand-text">
          <h1>Eventos y Sonido W&amp;R</h1>
          <p>Pide tu canción del catálogo en vivo</p>
        </div>
      </div>
      <div id="counterPill" class="counter-pill">0 / 3 elegidas</div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Busca por canción o artista..." autocomplete="off" />
      <button id="clearSearch" class="clear-btn" title="Limpiar búsqueda">✕</button>
    </div>

    <div id="genresBar" class="genres-bar">
      <button class="genre-chip active" data-genre="TODOS">Todos</button>
    </div>
  </header>

  <main>
    <div class="results-info">
      <span id="resultsCount">Cargando catálogo...</span>
      <button id="sortToggle" class="sort-toggle" title="Cambiar orden alfabético">Orden: Título A–Z ⇅</button>
    </div>
    <div id="songList" class="song-list"></div>
  </main>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <div id="selectedPreview" class="selected-preview"></div>
      <input type="text" id="guestName" class="guest-input" placeholder="Número de mesa (opcional, ej. Mesa 5)" maxlength="50" />
      <button id="sendWaBtn" class="wa-btn" disabled>
        Selecciona al menos 1 canción
      </button>
    </div>
  </div>

  <script>
    const WHATSAPP_NUMBER = "593993983329";
    const MAX_SONGS = 3;
    const CSV_FILE = "musica.csv";

    let allSongs = [];
    let selectedSongs = [];
    let activeGenre = "TODOS";
    let searchQuery = "";
    let sortBy = "titulo";

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearch");
    const genresBar = document.getElementById("genresBar");
    const songList = document.getElementById("songList");
    const resultsCount = document.getElementById("resultsCount");
    const sortToggle = document.getElementById("sortToggle");
    const counterPill = document.getElementById("counterPill");
    const selectedPreview = document.getElementById("selectedPreview");
    const guestNameInput = document.getElementById("guestName");
    const sendWaBtn = document.getElementById("sendWaBtn");
    const toastEl = document.getElementById("toast");

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
      if (lines.length < 2) return [];

      const songs = [];
      for (let i = 1; i < lines.length; i++) {
        const row = [];
        let current = "";
        let inQuotes = false;

        for (let c = 0; c < lines[i].length; c++) {
          const char = lines[i][c];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === "," && !inQuotes) {
            row.push(current.trim());
            current = "";
          } else {
            current += char;
          }
        }
        row.push(current.trim());

        if (row.length >= 3 && row[0]) {
          songs.push({
            id: i,
            titulo: row[0],
            artista: row[1] || "Artista Varios",
            genero: row[2] || "General"
          });
        }
      }
      return songs;
    }

    function sortSongsList(list) {
      return [...list].sort((a, b) => {
        if (sortBy === "artista") {
          const cmpArt = a.artista.localeCompare(b.artista, "es", { sensitivity: "base" });
          return cmpArt !== 0 ? cmpArt : a.titulo.localeCompare(b.titulo, "es", { sensitivity: "base" });
        } else {
          const cmpTit = a.titulo.localeCompare(b.titulo, "es", { sensitivity: "base" });
          return cmpTit !== 0 ? cmpTit : a.artista.localeCompare(b.artista, "es", { sensitivity: "base" });
        }
      });
    }

    async function loadCatalog() {
      try {
        const response = await fetch(CSV_FILE + "?v=" + Date.now());
        if (!response.ok) throw new Error("No se pudo cargar musica.csv");
        const csvText = await response.text();
        allSongs = parseCSV(csvText);
        buildGenreChips();
        renderSongs();
      } catch (err) {
        resultsCount.textContent = "Error al cargar el catálogo.";
        songList.innerHTML = `<div class="empty-state">No se encontró el archivo <b>musica.csv</b> en el servidor.</div>`;
      }
    }

    function buildGenreChips() {
      const genres = [...new Set(allSongs.map(s => s.genero))].sort((a, b) =>
        a.localeCompare(b, "es", { sensitivity: "base" })
      );
      genres.forEach(genre => {
        const btn = document.createElement("button");
        btn.className = "genre-chip";
        btn.dataset.genre = genre;
        btn.textContent = genre.replace(/_/g, " ");
        btn.addEventListener("click", () => {
          document.querySelectorAll(".genre-chip").forEach(c => c.classList.remove("active"));
          btn.classList.add("active");
          activeGenre = genre;
          renderSongs();
        });
        genresBar.appendChild(btn);
      });

      genresBar.querySelector('[data-genre="TODOS"]').addEventListener("click", (e) => {
        document.querySelectorAll(".genre-chip").forEach(c => c.classList.remove("active"));
        e.target.classList.add("active");
        activeGenre = "TODOS";
        renderSongs();
      });
    }

    function isSelected(songId) {
      return selectedSongs.some(s => s.id === songId);
    }

    function toggleSong(song) {
      const idx = selectedSongs.findIndex(s => s.id === song.id);
      if (idx > -1) {
        selectedSongs.splice(idx, 1);
      } else {
        if (selectedSongs.length >= MAX_SONGS) {
          showToast(`Máximo ${MAX_SONGS} canciones por pedido`);
          return;
        }
        selectedSongs.push(song);
      }
      updateSelectionUI();
      renderSongs();
    }

    function updateSelectionUI() {
      const count = selectedSongs.length;
      counterPill.textContent = `${count} / ${MAX_SONGS} elegidas`;

      selectedPreview.innerHTML = "";
      selectedSongs.forEach(song => {
        const tag = document.createElement("div");
        tag.className = "mini-tag";
        tag.innerHTML = `${escapeHtml(song.titulo)} <span title="Quitar">✕</span>`;
        tag.querySelector("span").addEventListener("click", () => toggleSong(song));
        selectedPreview.appendChild(tag);
      });

      if (count === 0) {
        sendWaBtn.disabled = true;
        sendWaBtn.textContent = "Selecciona al menos 1 canción";
      } else {
        sendWaBtn.disabled = false;
        const label = count === 1 ? "1 canción" : `${count} canciones`;
        sendWaBtn.textContent = `📲 Enviar pedido por WhatsApp (${label})`;
      }
    }

    function renderSongs() {
      const q = searchQuery.toLowerCase().trim();
      const filtered = allSongs.filter(song => {
        const matchGenre = activeGenre === "TODOS" || song.genero === activeGenre;
        const matchText = !q ||
          song.titulo.toLowerCase().includes(q) ||
          song.artista.toLowerCase().includes(q) ||
          song.genero.toLowerCase().includes(q);
        return matchGenre && matchText;
      });

      const sorted = sortSongsList(filtered);
      resultsCount.textContent = `${sorted.length} canciones (A–Z)`;

      if (sorted.length === 0) {
        songList.innerHTML = `<div class="empty-state">No encontramos canciones con ese nombre.<br>Prueba con otro artista o género.</div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      sorted.forEach(song => {
        const chosen = isSelected(song.id);
        const card = document.createElement("div");
        card.className = "song-card" + (chosen ? " selected" : "");

        card.innerHTML = `
          <div class="song-info">
            <div class="song-title">${escapeHtml(song.titulo)}</div>
            <div class="song-artist">${escapeHtml(song.artista)}</div>
            <span class="song-genre">${escapeHtml(song.genero)}</span>
          </div>
          <button class="pick-btn">${chosen ? "✓ Elegida" : "+ Pedir"}</button>
        `;

        card.querySelector(".pick-btn").addEventListener("click", () => toggleSong(song));
        fragment.appendChild(card);
      });

      songList.innerHTML = "";
      songList.appendChild(fragment);
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    sortToggle.addEventListener("click", () => {
      if (sortBy === "titulo") {
        sortBy = "artista";
        sortToggle.textContent = "Orden: Artista A–Z ⇅";
      } else {
        sortBy = "titulo";
        sortToggle.textContent = "Orden: Título A–Z ⇅";
      }
      renderSongs();
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.style.display = searchQuery ? "flex" : "none";
      renderSongs();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.style.display = "none";
      renderSongs();
      searchInput.focus();
    });

    sendWaBtn.addEventListener("click", () => {
      if (selectedSongs.length === 0) return;

      const mesa = guestNameInput.value.trim();
      let msg = `🎧 *PEDIDO EN VIVO — Eventos y Sonido W&R*\n`;
      if (mesa) {
        msg += `🪑 *Mesa / Referencia:* ${mesa}\n`;
      }
      msg += `\n🎵 *Canciones solicitadas:*\n`;

      selectedSongs.forEach((s, idx) => {
        msg += `${idx + 1}. *${s.titulo}* — ${s.artista} _(${s.genero})_\n`;
      });

      const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
      window.open(waUrl, "_blank");
    });

    loadCatalog();
  </script>
</body>
</html>
